<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Kitchen</title>
<style>
/* Old Chrome on the Nexus 6P: no CSS nesting, :has(), container queries or flex gap. */
html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #eee; }
body { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
button { font-family: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
#app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 16px 18px;
  box-sizing: border-box; transition: transform 2s ease; overflow-y: auto; }

.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.clock { font-size: 32px; font-weight: 300; }
.clock small { font-size: 16px; color: #888; margin-left: 4px; }
.date { font-size: 17px; color: #999; text-align: right; }
.stale { font-size: 12px; color: #c98a2b; }

.label { font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
.card { background: #111; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }

.wx-now { display: flex; align-items: center; }
.wx-icon { font-size: 44px; line-height: 1; margin-right: 14px; }
.wx-temp { font-size: 50px; font-weight: 300; line-height: 1; }
.wx-sum { font-size: 17px; color: #bbb; margin-top: 4px; }
.hours { display: flex; flex-wrap: wrap; margin-top: 8px; }
.hr { width: 16.66%; text-align: center; padding: 3px 0; box-sizing: border-box; }
.hr .t { font-size: 13px; color: #888; }
.hr .i { font-size: 21px; line-height: 27px; }
.hr .d { font-size: 17px; }
.hr .p { font-size: 12px; color: #6fb3ff; height: 13px; }

.prep { background: #2a2100; color: #ffd36b; border-radius: 12px; padding: 10px 14px; font-size: 18px; margin-bottom: 12px; }
.tonight-small { font-size: 18px; color: #bbb; background: #111; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.tonight-small b { color: #eee; font-weight: 500; }
.tonight-small .pn { color: #ffd36b; margin-top: 4px; }

.dinner-name { font-size: 34px; font-weight: 500; line-height: 1.15; }
.dinner-meta { font-size: 17px; color: #999; margin-top: 6px; }
.evening .dinner-name { font-size: 42px; }
.datenight { font-size: 20px; color: #ff9ec4; margin: 14px 0 4px; }
.big-btn { display: block; width: 100%; background: #f5a623; color: #000; font-size: 26px; font-weight: 600;
  border-radius: 14px; padding: 22px 0; margin-top: 18px; }
.none { font-size: 24px; color: #bbb; }

.rate { margin-top: 18px; }
.rate-q { font-size: 20px; margin-bottom: 10px; }
.rate-row { display: flex; }
.rate-row button { flex: 1; font-size: 20px; padding: 16px 0; border-radius: 12px; background: #1c1c1c; }
.rate-row button + button { margin-left: 10px; }
.rate-row button.on-keep { background: #1f6b3a; }
.rate-row button.on-never { background: #7a2323; }

.restock-grid { display: flex; flex-wrap: wrap; margin: 0 -5px; }
.rs { width: 50%; padding: 5px; box-sizing: border-box; }
.rs button { width: 100%; height: 66px; border-radius: 14px; background: #1c1c1c; font-size: 22px; }
.rs button.on { background: #1f6b3a; }
.rs button .sub { display: block; font-size: 12px; color: #9fd9b1; margin-top: 2px; }
.add-btn { display: block; width: 100%; margin-top: 6px; height: 52px; border-radius: 14px; border: 2px dashed #333 !important; font-size: 20px; color: #bbb; }
.chips { margin-top: 10px; }
.chip { display: inline-block; background: #1f6b3a; border-radius: 20px; padding: 8px 14px; margin: 0 6px 6px 0; font-size: 17px; }

/* Night: dim everything, big clock that wanders. */
.night .top { display: none; }
.night-clock { position: absolute; left: 0; right: 0; text-align: center; color: #3a3a3a; font-size: 88px; font-weight: 200; transition: top 2s ease; }
.night-wx { position: absolute; left: 0; right: 0; text-align: center; color: #333; font-size: 22px; transition: top 2s ease; }

/* Overlays (cook view, add search) */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 10; display: none; }
.overlay.open { display: block; }
.ov-inner { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; }
.ov-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ov-title { font-size: 17px; color: #999; }
.ov-close { font-size: 20px; color: #bbb; background: #1c1c1c !important; border-radius: 12px; padding: 12px 18px !important; }

.timers { min-height: 0; }
.timer-chip { display: inline-block; background: #1c1c1c; border-radius: 12px; padding: 10px 14px; margin: 0 8px 8px 0; font-size: 20px; }
.timer-chip.done { background: #b3261e; animation: flash 1s infinite; }
@keyframes flash { 50% { background: #5a120e; } }

.step-area { flex: 1; overflow: auto; padding: 8px 0; }
.step-no { font-size: 16px; color: #f5a623; margin-bottom: 10px; letter-spacing: 1px; }
.step-text { font-size: 31px; line-height: 1.3; }
.step-timer { display: block; margin-top: 24px; background: #1c1c1c; border: 2px solid #f5a623 !important; color: #f5a623;
  font-size: 26px; border-radius: 14px; padding: 18px 22px; }
.step-timer.running { border-color: #444 !important; color: #eee; }
.ing { font-size: 21px; line-height: 1.35; }
.ing div { display: flex; padding: 5px 0; border-bottom: 1px solid #1a1a1a; }
.ing .q { width: 96px; flex: none; color: #f5a623; }
.hint { font-size: 14px; color: #666; margin-top: 12px; }
.nav { display: flex; padding-top: 10px; }
.nav button { flex: 1; font-size: 24px; padding: 22px 0; border-radius: 14px; background: #1c1c1c; }
.nav button + button { margin-left: 10px; }
.nav .next { background: #f5a623; color: #000; font-weight: 600; flex: 2; }

.search-input { width: 100%; box-sizing: border-box; font-size: 28px; padding: 14px 16px; border-radius: 14px;
  border: 2px solid #333; background: #111; color: #eee; outline: none; font-family: inherit; }
.results { margin-top: 12px; overflow: auto; flex: 1; }
.results button { display: block; width: 100%; text-align: left; font-size: 24px; padding: 18px 16px; border-radius: 12px; background: #151515; margin-bottom: 8px; }
.results button.free { color: #f5a623; }
</style>
</head>
<body>
<div id="app"></div>
<div id="cook" class="overlay"></div>
<div id="search" class="overlay"></div>

<script>
/* Kitchen wall display. Deliberately old-style JavaScript (var, functions, no arrow
   functions or template strings) so it runs on the Nexus 6P's old browser. */
(function () {
  'use strict';

  var CONFIG = {
    // Kitsilano, Vancouver
    lat: 49.2684,
    lon: -123.1683,
    timezone: 'America/Vancouver',
    recipesUrl: 'recipes.json',
    weekUrl: 'week.json',
    restockFixed: ['yogurt', 'granola', 'milk', 'fruit'],
    dateNightDays: [2, 4],           // Tuesday, Thursday
    ratePromptAfter: 19 * 60 + 30,   // show "keep or never?" from 7:30 pm even if Start cooking wasn't used
    dataRefreshMs: 15 * 60 * 1000,
    weatherRefreshMs: 30 * 60 * 1000,
    reloadHour: 4                    // reload the page daily at 4 am to pick up new versions
  };

  var DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // ---------- time (with ?now=2026-09-22T17:30 override for testing) ----------
  var timeOffset = 0;
  (function () {
    var m = /[?&]now=([^&]+)/.exec(location.search);
    if (!m) return;
    var p = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(decodeURIComponent(m[1]));
    if (p) timeOffset = new Date(+p[1], +p[2] - 1, +p[3], +(p[4] || 12), +(p[5] || 0)).getTime() - Date.now();
  })();
  function now() { return new Date(Date.now() + timeOffset); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isoHour(d) { return isoDate(d) + 'T' + pad(d.getHours()) + ':00'; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function clock12(d) {
    var h = d.getHours() % 12 || 12;
    return { hm: h + ':' + pad(d.getMinutes()), ampm: d.getHours() < 12 ? 'am' : 'pm' };
  }
  function hourLabel(h) { return (h % 12 || 12) + (h < 12 ? 'a' : 'p'); }

  function modeFor(d) {
    var h = d.getHours();
    if (h >= 5 && h < 11) return 'morning';
    if (h >= 11 && h < 16) return 'day';
    if (h >= 16 && h < 21) return 'evening';
    return 'night';
  }

  // ---------- storage (never throws) ----------
  function load(key, fallback) {
    try { var v = localStorage.getItem('kd.' + key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem('kd.' + key, JSON.stringify(value)); } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  // ---------- data: last good copy is kept so a failed fetch shows old data, not an error ----------
  var state = {
    recipes: load('recipes', {}),
    week: load('week', { default: {}, rows: [] }),
    weather: load('weather', null),        // { at: ms, data: open-meteo response }
    dataOk: true,
    weatherOk: true
  };

  function getJSON(url) {
    return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function refreshData() {
    return Promise.all([getJSON(CONFIG.recipesUrl), getJSON(CONFIG.weekUrl)])
      .then(function (res) {
        state.recipes = res[0]; state.week = res[1]; state.dataOk = true;
        save('recipes', res[0]); save('week', res[1]);
      })
      .catch(function () { state.dataOk = false; })
      .then(render);
  }

  function refreshWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
      '&current=temperature_2m,weather_code,is_day' +
      '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=' + encodeURIComponent(CONFIG.timezone) + '&forecast_days=3';
    return fetch(url)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        state.weather = { at: Date.now(), data: data }; state.weatherOk = true;
        save('weather', state.weather);
      })
      .catch(function () { state.weatherOk = false; })
      .then(render);
  }

  // ---------- plan ----------
  function planFor(d) {
    var date = isoDate(d), rows = state.week.rows || [], i;
    for (i = 0; i < rows.length; i++) {
      if (rows[i].date === date) return rows[i].recipe_id ? rows[i] : null;
    }
    var def = (state.week['default'] || {})[DAY_KEYS[d.getDay()]];
    return def && def.recipe_id ? def : null;
  }
  function recipeFor(plan) { return plan ? state.recipes[plan.recipe_id] || null : null; }
  function nextPlanned(d) {
    for (var i = 1; i <= 7; i++) {
      var day = addDays(d, i), p = planFor(day), r = recipeFor(p);
      if (r) return { day: day, recipe: r };
    }
    return null;
  }

  // ---------- weather ----------
  function wxIcon(code, isDay) {
    if (code === 0) return isDay === 0 ? '🌙' : '☀️';
    if (code === 1 || code === 2) return isDay === 0 ? '☁️' : '🌤️';
    if (code === 3) return '☁️';
    if (code === 45 || code === 48) return '🌫️';
    if (code >= 51 && code <= 57) return '🌦️';
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return '🌧️';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return '🌨️';
    if (code >= 95) return '⛈️';
    return '·';
  }
  function wxWord(code) {
    if (code === 0) return 'Clear';
    if (code === 1) return 'Mostly clear';
    if (code === 2) return 'Partly cloudy';
    if (code === 3) return 'Cloudy';
    if (code === 45 || code === 48) return 'Fog';
    if (code >= 51 && code <= 57) return 'Drizzle';
    if (code >= 61 && code <= 67) return 'Rain';
    if (code >= 71 && code <= 77) return 'Snow';
    if (code >= 80 && code <= 82) return 'Showers';
    if (code === 85 || code === 86) return 'Snow showers';
    if (code >= 95) return 'Thunderstorms';
    return '';
  }
  function dayIndex(daily, d) { return daily ? daily.time.indexOf(isoDate(d)) : -1; }

  function staleNote() {
    if (!state.weather) return '';
    var mins = Math.round((Date.now() - state.weather.at) / 60000);
    if (state.weatherOk && mins < 90) return '';
    var t = clock12(new Date(state.weather.at));
    return '<div class="stale">Weather from ' + t.hm + t.ampm + ' (offline)</div>';
  }

  function weatherCard(n) {
    if (!state.weather) return '<div class="card"><div class="wx-sum">Weather loading…</div></div>';
    var data = state.weather.data, h = data.hourly, dl = data.daily;
    var start = h.time.indexOf(isoHour(n));
    if (start < 0) start = 0;
    var cur = data.current && state.weatherOk ? data.current : { temperature_2m: h.temperature_2m[start], weather_code: h.weather_code[start], is_day: h.is_day[start] };
    var di = dayIndex(dl, n), sum = wxWord(cur.weather_code);
    if (di >= 0) {
      sum += ' · H ' + Math.round(dl.temperature_2m_max[di]) + '° L ' + Math.round(dl.temperature_2m_min[di]) + '°';
      if (dl.precipitation_probability_max[di] >= 20) sum += ' · Rain ' + dl.precipitation_probability_max[di] + '%';
    }
    var html = '<div class="card"><div class="wx-now"><div class="wx-icon">' + wxIcon(cur.weather_code, cur.is_day) +
      '</div><div><div class="wx-temp">' + Math.round(cur.temperature_2m) + '°</div></div></div>' +
      '<div class="wx-sum">' + esc(sum) + '</div><div class="hours">';
    for (var i = start + 1; i <= start + 12 && i < h.time.length; i++) {
      var hr = +h.time[i].substr(11, 2), p = h.precipitation_probability[i];
      html += '<div class="hr"><div class="t">' + hourLabel(hr) + '</div><div class="i">' +
        wxIcon(h.weather_code[i], h.is_day[i]) + '</div><div class="d">' + Math.round(h.temperature_2m[i]) +
        '°</div><div class="p">' + (p >= 20 ? p + '%' : '') + '</div></div>';
    }
    return html + '</div>' + staleNote() + '</div>';
  }

  // ---------- restock (v1: kept on this screen; step 2 sends it to the sheet) ----------
  var restock = load('restock', []);   // rows shaped like the sheet: { ts, item, ordered_on }
  function isRequested(item) {
    for (var i = 0; i < restock.length; i++) if (restock[i].item === item && !restock[i].ordered_on) return true;
    return false;
  }
  function requestItem(item) {
    item = item.toLowerCase().replace(/^\s+|\s+$/g, '');
    if (!item || isRequested(item)) return;
    var d = now();
    restock.push({ ts: isoDate(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()), item: item, ordered_on: '' });
    save('restock', restock);
  }
  function unrequestItem(item) {
    for (var i = restock.length - 1; i >= 0; i--) {
      if (restock[i].item === item && !restock[i].ordered_on) { restock.splice(i, 1); break; }
    }
    save('restock', restock);
  }

  function restockBlock() {
    var html = '<div class="label">Running low?</div><div class="restock-grid">';
    CONFIG.restockFixed.forEach(function (item) {
      var on = isRequested(item);
      html += '<div class="rs"><button class="' + (on ? 'on' : '') + '" data-action="restock" data-item="' + esc(item) + '">' +
        (on ? '✓ ' : '') + cap(esc(item)) + (on ? '<span class="sub">on the list · tap to undo</span>' : '') + '</button></div>';
    });
    html += '</div><button class="add-btn" data-action="open-search">+ Add something else</button>';
    var extras = restock.filter(function (r) { return !r.ordered_on && CONFIG.restockFixed.indexOf(r.item) < 0; });
    if (extras.length) {
      html += '<div class="chips">';
      extras.forEach(function (r) {
        html += '<button class="chip" data-action="restock" data-item="' + esc(r.item) + '">✓ ' + cap(esc(r.item)) + ' ✕</button>';
      });
      html += '</div>';
    }
    return html;
  }

  // ---------- ratings (v1: kept on this screen; step 2 writes them to the week tab) ----------
  var ratings = load('ratings', {});   // { '2026-09-22': 'keep' | 'never' }
  var cookedToday = load('cooked', '');

  function ratingBlock(n, recipe) {
    var date = isoDate(n), r = ratings[date];
    var minutes = n.getHours() * 60 + n.getMinutes();
    if (!r && cookedToday !== date && minutes < CONFIG.ratePromptAfter) return '';
    return '<div class="rate"><div class="rate-q">' + (r ? 'Saved. Tap to change.' : 'How was ' + esc(recipe.name) + '?') +
      '</div><div class="rate-row">' +
      '<button class="' + (r === 'keep' ? 'on-keep' : '') + '" data-action="rate" data-value="keep">👍 Keep</button>' +
      '<button class="' + (r === 'never' ? 'on-never' : '') + '" data-action="rate" data-value="never">Never again</button>' +
      '</div></div>';
  }

  // ---------- screens ----------
  function header(n) {
    var c = clock12(n);
    return '<div class="top"><div class="clock">' + c.hm + '<small>' + c.ampm + '</small></div>' +
      '<div class="date">' + DAY_NAMES[n.getDay()] + '<br>' + MONTHS[n.getMonth()] + ' ' + n.getDate() +
      (state.dataOk ? '' : '<div class="stale">Offline: last saved plan</div>') + '</div></div>';
  }

  function prepBanner(plan) {
    return plan && plan.prep_note ? '<div class="prep">Today: ' + esc(plan.prep_note) + '</div>' : '';
  }

  function nothingTonight(n) {
    var nx = nextPlanned(n);
    return '<div class="none">Nothing planned tonight.</div>' +
      (nx ? '<div class="dinner-meta">Next: ' + DAY_NAMES[nx.day.getDay()] + ', ' + esc(nx.recipe.name) + '</div>' : '');
  }

  function morning(n) {
    var plan = planFor(n), r = recipeFor(plan);
    return header(n) + weatherCard(n) +
      (r ? '<div class="tonight-small">Tonight: <b>' + esc(r.name) + '</b>' +
        (plan.prep_note ? '<div class="pn">' + esc(plan.prep_note) + '</div>' : '') + '</div>' : prepBanner(plan)) +
      restockBlock();
  }

  function day(n) {
    var plan = planFor(n), r = recipeFor(plan);
    var body = r
      ? '<div class="label">Tonight</div><div class="dinner-name">' + esc(r.name) + '</div>' +
        '<div class="dinner-meta">' + r.minutes + ' min</div>'
      : nothingTonight(n);
    return header(n) + '<div class="card">' + body + '</div>' + prepBanner(plan) + restockBlock();
  }

  function evening(n) {
    var r = recipeFor(planFor(n)), body;
    if (!r) {
      body = nothingTonight(n);
    } else {
      body = '<div class="label">Tonight</div><div class="dinner-name">' + esc(r.name) + '</div>' +
        '<div class="dinner-meta">' + r.minutes + ' min · ' + r.steps.length + ' steps' +
        (r.servings ? ' · serves ' + r.servings : '') + '</div>' +
        (CONFIG.dateNightDays.indexOf(n.getDay()) >= 0 ? '<div class="datenight">🕯️ Date night</div>' : '') +
        '<button class="big-btn" data-action="cook">Start cooking</button>' + ratingBlock(n, r);
    }
    return header(n) + '<div class="evening">' + body + '</div>';
  }

  var nightSpots = [120, 200, 280, 160, 240];
  function night(n) {
    var c = clock12(n), top = nightSpots[Math.floor(n.getTime() / 60000) % nightSpots.length];
    var wx = '';
    if (state.weather) {
      var dl = state.weather.data.daily, i = dayIndex(dl, addDays(n, n.getHours() < 5 ? 0 : 1));
      if (i >= 0) {
        wx = (n.getHours() < 5 ? 'Today ' : 'Tomorrow ') + wxIcon(dl.weather_code[i], 1) + ' ' +
          Math.round(dl.temperature_2m_max[i]) + '° / ' + Math.round(dl.temperature_2m_min[i]) + '°' +
          (dl.precipitation_probability_max[i] >= 20 ? ' · rain ' + dl.precipitation_probability_max[i] + '%' : '');
      }
    }
    return '<div class="night-clock" style="top:' + top + 'px">' + c.hm + '</div>' +
      '<div class="night-wx" style="top:' + (top + 120) + 'px">' + wx + '</div>';
  }

  var app = document.getElementById('app');
  var lastRendered = '';
  function render() {
    var n = now(), mode = modeFor(n);
    var html = mode === 'morning' ? morning(n) : mode === 'day' ? day(n) : mode === 'evening' ? evening(n) : night(n);
    document.body.className = mode;
    if (html !== lastRendered) { app.innerHTML = html; lastRendered = html; }
  }

  // ---------- burn-in protection: nudge the whole layout a few pixels every minute ----------
  var shifts = [[0, 0], [3, 2], [-2, 4], [4, -3], [-4, -2], [2, -4], [-3, 3]];
  function shift() {
    var s = shifts[Math.floor(Date.now() / 60000) % shifts.length];
    var t = 'translate(' + s[0] + 'px,' + s[1] + 'px)';
    app.style.webkitTransform = t; app.style.transform = t;
  }

  // ---------- sound ----------
  var audio = null;
  function unlockAudio() {
    if (audio) return;
    try { var C = window.AudioContext || window.webkitAudioContext; if (C) audio = new C(); } catch (e) {}
  }
  function beep() {
    if (navigator.vibrate) try { navigator.vibrate([300, 150, 300]); } catch (e) {}
    if (!audio) return;
    try {
      if (audio.resume) audio.resume();
      [0, 0.35, 0.7].forEach(function (off) {
        var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + off;
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        o.start(t); o.stop(t + 0.3);
      });
    } catch (e) {}
  }

  // ---------- cook view ----------
  var cookEl = document.getElementById('cook');
  var cook = null;          // { recipe, step }  step -1 = ingredient list
  var timers = [];          // { key, label, end, done, lastBeep }
  var wakeLock = null;

  function fmtQty(q, unit) {
    var fr = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
    function num(x) {
      var whole = Math.floor(x), part = Math.round((x - whole) * 100) / 100;
      if (part === 0) return '' + whole;
      if (fr[part]) return (whole ? whole : '') + fr[part];
      return '' + (Math.round(x * 10) / 10);
    }
    if (unit === 'ml' && q < 60) {
      if (q % 15 === 0) return num(q / 15) + ' tbsp';
      return num(q / 5) + ' tsp';
    }
    if (unit === 'ea') return num(q);
    if (unit === 'g' || unit === 'ml') return q + ' ' + unit;
    return num(q) + ' ' + unit + (q > 1 ? 's' : '');
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + pad(sec % 60);
  }

  function openCook() {
    var r = recipeFor(planFor(now()));
    if (!r) return;
    cook = { recipe: r, step: -1 };
    cookEl.className = 'overlay open';
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {}); } catch (e) {}
    renderCook();
  }
  function closeCook(finished) {
    if (finished) { cookedToday = isoDate(now()); save('cooked', cookedToday); }
    cook = null; timers = [];
    cookEl.className = 'overlay';
    cookEl.innerHTML = '';
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    lastRendered = ''; render();
  }

  function timerFor(key) {
    for (var i = 0; i < timers.length; i++) if (timers[i].key === key) return timers[i];
    return null;
  }

  function renderCook() {
    var r = cook.recipe, s = cook.step, last = r.steps.length - 1, body;
    if (s < 0) {
      body = '<div class="step-no">GET THESE OUT</div><div class="ing">';
      r.ingredients.forEach(function (ing) {
        body += '<div><span class="q">' + esc(fmtQty(ing.qty, ing.unit)) + '</span><span>' + esc(ing.item) + '</span></div>';
      });
      body += '</div><div class="hint">Tap the screen or Next to go to step 1.</div>';
    } else {
      var st = r.steps[s];
      body = '<div class="step-no">STEP ' + (s + 1) + ' OF ' + r.steps.length + '</div>' +
        '<div class="step-text">' + esc(st.text) + '</div>' +
        (st.timer ? '<button class="step-timer" id="step-timer" data-action="timer"></button>' : '');
    }
    cookEl.innerHTML = '<div class="ov-inner"><div class="ov-head"><div class="ov-title">' + esc(r.name) + '</div>' +
      '<button class="ov-close" data-action="cook-exit">Exit</button></div>' +
      '<div class="timers" id="timers"></div>' +
      '<div class="step-area" data-action="next">' + body + '</div>' +
      '<div class="nav"><button data-action="back">' + (s < 0 ? 'Exit' : 'Back') + '</button>' +
      '<button class="next" data-action="next">' + (s === last ? 'Done' : 'Next') + '</button></div></div>';
    tickTimers();
  }

  function tickTimers() {
    if (!cook) return;
    var t = Date.now(), html = '';
    timers.forEach(function (tm) {
      var left = (tm.end - t) / 1000;
      if (left <= 0 && !tm.done) { tm.done = true; tm.lastBeep = 0; }
      if (tm.done && t - tm.lastBeep > 10000 && t - tm.end < 120000) { tm.lastBeep = t; beep(); }
      if (!tm.done && tm.key === 's' + cook.step) return;
      html += '<button class="timer-chip' + (tm.done ? ' done' : '') + '" data-action="timer-clear" data-key="' + tm.key + '">' +
        (tm.done ? '⏰ ' + esc(tm.label) + ' done · tap' : '⏱ ' + esc(tm.label) + ' ' + fmtTime(left)) + '</button>';
    });
    var bar = document.getElementById('timers');
    if (bar && bar.innerHTML !== html) bar.innerHTML = html;
    var btn = document.getElementById('step-timer');
    if (btn && cook.step >= 0) {
      var st = cook.recipe.steps[cook.step], tm = timerFor('s' + cook.step);
      var label = !tm ? 'Start ' + fmtTime(st.timer) + ' timer' : tm.done ? 'Timer done' : fmtTime((tm.end - t) / 1000) + ' left';
      btn.className = 'step-timer' + (tm ? ' running' : '');
      if (btn.textContent !== label) btn.textContent = label;
    }
  }

  function startTimer() {
    var key = 's' + cook.step;
    if (timerFor(key)) return;
    timers.push({ key: key, label: 'Step ' + (cook.step + 1), end: Date.now() + cook.recipe.steps[cook.step].timer * 1000, done: false, lastBeep: 0 });
    tickTimers();
  }

  // ---------- add-something search ----------
  var searchEl = document.getElementById('search');
  function searchPool() {
    var seen = {}, out = [];
    function add(x) { x = String(x).toLowerCase(); if (!seen[x]) { seen[x] = 1; out.push(x); } }
    CONFIG.restockFixed.forEach(add);
    Object.keys(state.recipes).forEach(function (k) {
      (state.recipes[k].ingredients || []).forEach(function (ing) { add(ing.item); });
    });
    restock.forEach(function (r) { add(r.item); });
    return out.sort();
  }
  function openSearch() {
    searchEl.className = 'overlay open';
    searchEl.innerHTML = '<div class="ov-inner"><div class="ov-head"><div class="ov-title">Add to the list</div>' +
      '<button class="ov-close" data-action="search-close">Cancel</button></div>' +
      '<input class="search-input" id="q" type="text" autocomplete="off" autocorrect="off" placeholder="Type 2–3 letters">' +
      '<div class="results" id="results"></div></div>';
    var q = document.getElementById('q');
    q.addEventListener('input', updateResults);
    q.focus();
  }
  function updateResults() {
    var q = document.getElementById('q').value.toLowerCase().replace(/^\s+|\s+$/g, ''), html = '';
    if (q.length >= 2) {
      var hits = searchPool().filter(function (x) {
        var words = x.split(/[\s-]+/);
        if (x.indexOf(q) === 0) return true;
        for (var i = 0; i < words.length; i++) if (words[i].indexOf(q) === 0) return true;
        return false;
      }).slice(0, 8);
      hits.forEach(function (x) {
        html += '<button data-action="search-pick" data-item="' + esc(x) + '">' + (isRequested(x) ? '✓ ' : '') + cap(esc(x)) + '</button>';
      });
      if (searchPool().indexOf(q) < 0 && (q.length >= 3 || !hits.length)) {
        html += '<button class="free" data-action="search-pick" data-item="' + esc(q) + '">Add “' + esc(q) + '”</button>';
      }
    }
    document.getElementById('results').innerHTML = html;
  }
  function closeSearch() {
    searchEl.className = 'overlay'; searchEl.innerHTML = '';
    lastRendered = ''; render();
  }

  // ---------- taps ----------
  function actionTarget(el) {
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-action')) return el;
      el = el.parentNode;
    }
    return null;
  }

  document.addEventListener('click', function (e) {
    unlockAudio();
    var el = actionTarget(e.target);
    if (!el) return;
    var a = el.getAttribute('data-action'), item = el.getAttribute('data-item');
    if (a === 'restock') {
      if (isRequested(item)) unrequestItem(item); else requestItem(item);
      render();
    } else if (a === 'open-search') {
      openSearch();
    } else if (a === 'search-pick') {
      requestItem(item); closeSearch();
    } else if (a === 'search-close') {
      closeSearch();
    } else if (a === 'rate') {
      ratings[isoDate(now())] = el.getAttribute('data-value'); save('ratings', ratings); render();
    } else if (a === 'cook') {
      openCook();
    } else if (a === 'cook-exit') {
      closeCook(false);
    } else if (a === 'next') {
      if (cook.step >= cook.recipe.steps.length - 1) closeCook(true);
      else { cook.step++; renderCook(); }
    } else if (a === 'back') {
      if (cook.step < 0) closeCook(false); else { cook.step--; renderCook(); }
    } else if (a === 'timer') {
      startTimer();
    } else if (a === 'timer-clear') {
      var key = el.getAttribute('data-key');
      timers = timers.filter(function (t) { return !(t.key === key && t.done); });
      tickTimers();
    }
  });

  // ---------- loops ----------
  var reloadedOn = isoDate(new Date());
  setInterval(function () {
    render(); shift();
    var d = new Date();
    // Daily reload picks up new versions pushed to GitHub. Skipped while cooking or offline.
    if (d.getHours() === CONFIG.reloadHour && isoDate(d) !== reloadedOn && !cook && navigator.onLine !== false) {
      reloadedOn = isoDate(d); location.reload();
    }
  }, 15000);
  setInterval(tickTimers, 500);
  setInterval(refreshData, CONFIG.dataRefreshMs);
  setInterval(refreshWeather, CONFIG.weatherRefreshMs);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && cook && navigator.wakeLock && !wakeLock) {
      navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {});
    }
  });

  render(); shift();
  refreshData();
  refreshWeather();
})();
</script>
</body>
</html>
